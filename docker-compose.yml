services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_feedback_factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-off}
      POSTGRES_USER: ${POSTGRES_USER:-off}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-off} -d ${POSTGRES_DB:-open_feedback_factory}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: node:25-alpine
    working_dir: /workspace
    command: >
      sh -lc "npm install -g pnpm@10.28.1 &&
      pnpm install --frozen-lockfile=false &&
      DATABASE_URL=$${DOCKER_DATABASE_URL:-postgres://off:off@postgres:5432/open_feedback_factory}
      pnpm --filter @open-feedback-factory/db migrate &&
      DATABASE_URL=$${DOCKER_DATABASE_URL:-postgres://off:off@postgres:5432/open_feedback_factory}
      pnpm --filter @open-feedback-factory/api dev"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-4100}
      APPROVAL_MODE: ${APPROVAL_MODE:-manual}
      AUTO_MERGE_ENABLED: ${AUTO_MERGE_ENABLED:-false}
      CODEX_AUTH_MODE: ${CODEX_AUTH_MODE:-cli}
      CODEX_CLI: ${CODEX_CLI:-codex}
      CODEX_EFFORT: ${CODEX_EFFORT:-extra-high}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.5}
      CODEX_RUNNER_MODE: ${CODEX_RUNNER_MODE:-disabled}
      CODEX_SECRETS_PATH: ${CODEX_SECRETS_PATH:-/workspace/.off/secrets.env}
      CODEX_TIMEOUT_MS: ${CODEX_TIMEOUT_MS:-300000}
      CONTROL_CENTER_URL: ${CONTROL_CENTER_URL:-http://localhost:5173}
      DOCKER_DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://off:off@postgres:5432/open_feedback_factory}
      GITHUB_MODE: ${GITHUB_MODE:-disabled}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-joewilsonai}
      GITHUB_REPO: ${GITHUB_REPO:-open-feedback-factory}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-webhook-secret}
      MAX_FEATURE_COST_USD: ${MAX_FEATURE_COST_USD:-5}
      MAX_SAFE_DIFF_LINES: ${MAX_SAFE_DIFF_LINES:-120}
      PROTECTED_PATHS: ${PROTECTED_PATHS:-auth,billing,privacy,legal,encryption,secrets,infra,migrations,release}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      SDK_RATE_LIMIT_MAX: ${SDK_RATE_LIMIT_MAX:-120}
      ADMIN_RATE_LIMIT_MAX: ${ADMIN_RATE_LIMIT_MAX:-120}
      RUNNER_RATE_LIMIT_MAX: ${RUNNER_RATE_LIMIT_MAX:-300}
      GITHUB_RATE_LIMIT_MAX: ${GITHUB_RATE_LIMIT_MAX:-300}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4100}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_PORT:-4100}:4100"
    volumes:
      - .:/workspace
      - api-node-modules:/workspace/node_modules
      - api-pnpm-store:/workspace/.pnpm-store

  worker:
    image: node:25-alpine
    working_dir: /workspace
    command: >
      sh -lc "npm install -g pnpm@10.28.1 &&
      pnpm install --frozen-lockfile=false &&
      pnpm --filter @open-feedback-factory/worker dev"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: ${WORKER_API_BASE_URL:-http://api:4100}
      APPROVAL_MODE: ${APPROVAL_MODE:-manual}
      CODEX_AUTH_MODE: ${CODEX_AUTH_MODE:-cli}
      CODEX_CLI: ${CODEX_CLI:-codex}
      CODEX_EFFORT: ${CODEX_EFFORT:-extra-high}
      CODEX_MANAGE_GIT: ${CODEX_MANAGE_GIT:-false}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.5}
      CODEX_RUNNER_MODE: ${CODEX_RUNNER_MODE:-disabled}
      CODEX_SECRETS_PATH: ${CODEX_SECRETS_PATH:-/workspace/.off/secrets.env}
      CODEX_TIMEOUT_MS: ${CODEX_TIMEOUT_MS:-300000}
      CODEX_INPUT_USD_PER_1M: ${CODEX_INPUT_USD_PER_1M:-}
      CODEX_CACHED_INPUT_USD_PER_1M: ${CODEX_CACHED_INPUT_USD_PER_1M:-}
      CODEX_OUTPUT_USD_PER_1M: ${CODEX_OUTPUT_USD_PER_1M:-}
      CODEX_REASONING_OUTPUT_USD_PER_1M: ${CODEX_REASONING_OUTPUT_USD_PER_1M:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_CREATE_PR: ${GITHUB_CREATE_PR:-false}
      GITHUB_MODE: ${GITHUB_MODE:-disabled}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-joewilsonai}
      GITHUB_REPO: ${GITHUB_REPO:-open-feedback-factory}
      GITHUB_PR_BASE: ${GITHUB_PR_BASE:-main}
      RUNNER_WORKSPACE: ${RUNNER_WORKSPACE:-/workspace}
      WORKER_NAME: ${WORKER_NAME:-docker-worker}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_WORK_ITEM_ID: ${WORKER_WORK_ITEM_ID:-}
    volumes:
      - .:/workspace
      - worker-node-modules:/workspace/node_modules
      - worker-pnpm-store:/workspace/.pnpm-store

  control-center:
    image: node:25-alpine
    working_dir: /workspace
    command: >
      sh -lc "npm install -g pnpm@10.28.1 &&
      pnpm install --frozen-lockfile=false &&
      pnpm --filter @open-feedback-factory/control-center dev --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4100}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_DEV_API_PROXY_TARGET: http://api:4100
    ports:
      - "${CONTROL_CENTER_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - control-center-node-modules:/workspace/node_modules
      - control-center-pnpm-store:/workspace/.pnpm-store

  demo-app:
    image: node:25-alpine
    working_dir: /workspace
    command: >
      sh -lc "npm install -g pnpm@10.28.1 &&
      pnpm install --frozen-lockfile=false &&
      pnpm --filter @open-feedback-factory/demo-app dev --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4100}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_DEV_API_PROXY_TARGET: http://api:4100
    ports:
      - "${DEMO_APP_PORT:-5174}:5174"
    volumes:
      - .:/workspace
      - demo-app-node-modules:/workspace/node_modules
      - demo-app-pnpm-store:/workspace/.pnpm-store

volumes:
  api-node-modules:
  api-pnpm-store:
  control-center-node-modules:
  control-center-pnpm-store:
  demo-app-node-modules:
  demo-app-pnpm-store:
  worker-node-modules:
  worker-pnpm-store:
  postgres-data:
